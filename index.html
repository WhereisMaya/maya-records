<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>🕹️ Maya Records 🎭</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: black;
    }

    #background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.4s ease-in-out;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div id="background"></div>

  <script>
    let index = 1;
    const bg = document.getElementById('background');

    function setImage(num) {
      const filename = `mpm${num}.png`;
      const img = new Image();
      img.onload = () => {
        bg.style.backgroundImage = `url('${filename}')`;
        index = num + 1;
      };
      img.onerror = () => {
        index = 1;
        setImage(index);
      };
      img.src = filename;
    }

    document.body.addEventListener('click', () => {
      setImage(index);
    });

    // Initialize with mpm1.png
    setImage(index);
  </script>
</body>
</html>
