<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>🕹️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: black;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 9999;
      transition: opacity 1s ease-in-out;
    }

    #background {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-color: black;
      transition: background-image 0.5s ease-in-out;
      z-index: 1;
    }

    #video-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      height: 90vh;
      max-width: 100vw;
      max-height: 100vh;
      z-index: 2;
      opacity: 0;
      transition: opacity 5s ease-in-out;
      pointer-events: none;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      #video-container {
        width: 95vw;
        height: 95vh;
      }
      
      .controls-info {
        font-size: 8px;
        padding: 6px;
        bottom: 10px;
        left: 10px;
      }
    }

    #video-iframe, #video-player {
      width: 100%;
      height: 100%;
      border: none;
      transform-origin: center;
      transition: transform 0.3s ease;
    }

    #video-player {
      display: none;
    }

    .fade-in {
      opacity: 0.5;
    }

    .fade-out {
      opacity: 0;
    }

    .controls-info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: rgba(255, 255, 255, 0.8);
      font-family: monospace;
      font-size: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px;
      border-radius: 5px;
      overflow: hidden;
    }

    .controls-input {
      background: transparent;
      border: 1px solid rgba(0, 255, 0, 0.5);
      color: #00ff00;
      font-family: monospace;
      font-size: 10px;
      padding: 2px 4px;
      margin-top: 4px;
      outline: none;
      width: 200px;
    }

    .controls-input:focus {
      border-color: #00ff00;
      box-shadow: 0 0 5px #00ff00;
    }



    .typewriter {
      display: inline-block;
      border-right: 2px solid white;
      animation: blink 1s infinite;
      white-space: nowrap;
    }

    @keyframes blink {
      0%, 50% { border-color: white; }
      51%, 100% { border-color: transparent; }
    }

    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #000, #1a1a1a, #000);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
    }

    .login-container {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #00ff00;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      color: #00ff00;
      box-shadow: 0 0 20px #00ff00;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 20px #00ff00; }
      to { box-shadow: 0 0 30px #00ff00, 0 0 40px #00ff00; }
    }

    .login-container h2 {
      margin-bottom: 20px;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .login-container input {
      background: transparent;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px;
      margin: 10px 0;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      outline: none;
      width: 200px;
    }

    .login-container input:focus {
      box-shadow: 0 0 10px #00ff00;
    }

    .login-container button {
      background: transparent;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      transition: all 0.3s;
    }

    .login-container button:hover {
      background: #00ff00;
      color: #000;
    }

    .error-message {
      color: #ff0000;
      margin-top: 10px;
      font-size: 14px;
    }

    /* External overlay for mindseye.dev */
    .external-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      z-index: 2000;
      display: none;
    }

    #externalIframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none;
    }

    /* Assistant video */
    #lucky-video {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 400px;
      height: auto;
      background: transparent;
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 10000;
      display: none;
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay"></div>
  <div id="background"></div>
  
  <div id="video-container">
    <iframe id="video-iframe" 
            src="" 
            frameborder="0" 
            allowfullscreen
            allow="autoplay; encrypted-media">
    </iframe>
    <video id="video-player" 
           controls="false" 
           autoplay 
           loop 
           muted>
      Your browser does not support the video tag.
    </video>
  </div>

  <audio id="audio-player" autoplay loop>
    <source src="Track1NGE.mp3" type="audio/mpeg">
  </audio>

  <div class="controls-info" id="controlsInfo">
    <div id="controlsText"></div>
    <input type="text" class="controls-input" id="controlsInput" placeholder="Enter command..." />
  </div>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-container">
      <h2>SYSTEM LOGIN</h2>
      <input type="password" id="passwordInput" placeholder="Enter password..." />
      <br>
      <button onclick="attemptLogin()">ACCESS</button>
      <button onclick="closeLogin()">CLOSE</button>
      <div class="error-message" id="errorMessage"></div>
    </div>
  </div>

  <div class="external-overlay" id="externalOverlay">
    <iframe id="externalIframe" src="" frameborder="0"></iframe>
  </div>

  <video id="lucky-video" autoplay loop playsinline preload="auto" crossorigin="anonymous">
    <source src="lucky-assistant.webm" type="video/webm">
  </video>

  <script>
    let index = 1;
    let videoIndex = 0;
    let isVideoVisible = false;
    let videos = [];
    let currentVideoUrl = '';
    let isLoggedIn = false;
    let menuVideos = [];
    let menuVideoIndex = 0;
    let isMenuMode = false;
    let isFirstVideoLoad = true;
    
    const bg = document.getElementById('background');
    const audioPlayer = document.getElementById('audio-player');
    const videoContainer = document.getElementById('video-container');
    const videoIframe = document.getElementById('video-iframe');
    const videoPlayer = document.getElementById('video-player');
    const externalOverlay = document.getElementById('externalOverlay');
    const externalIframe = document.getElementById('externalIframe');
    const luckyVideo = document.getElementById('lucky-video');
    let externalInteractionEnabled = false;
    let isAssistantVisible = false;

    // Video player state
    let videoX = 50; // percentage
    let videoY = 50; // percentage
    let videoOpacity = 0.5;
    let videoScale = 1;

    // Load video playlist
    async function loadVideoPlaylist() {
      try {
        const response = await fetch('videopl.txt');
        const text = await response.text();
        videos = text.trim().split('\n').filter(line => line.trim() !== '');
        if (videos.length > 0) {
          loadNextVideo();
        }
      } catch (error) {
        console.error('Failed to load video playlist:', error);
      }
    }

    // Load menu video playlist
    async function loadMenuPlaylist() {
      try {
        const response = await fetch('menupl.txt');
        const text = await response.text();
        menuVideos = text.trim().split('\n').filter(line => line.trim() !== '');
        if (menuVideos.length > 0) {
          loadNextMenuVideo();
        }
      } catch (error) {
        console.error('Failed to load menu playlist:', error);
      }
    }

    function loadNextMenuVideo() {
      if (menuVideos.length === 0) return;
      
      if (menuVideoIndex >= menuVideos.length) {
        // All videos played, show the last URL as a website
        const lastUrl = menuVideos[menuVideos.length - 1];
        if (lastUrl.includes('http')) {
          videoIframe.style.display = 'block';
          videoPlayer.style.display = 'none';
          videoIframe.src = lastUrl;
          videoContainer.style.pointerEvents = 'auto';
        }
        return;
      }
      
      const currentUrl = menuVideos[menuVideoIndex];
      const isMP4 = currentUrl.toLowerCase().endsWith('.mp4');
      
      if (isMP4) {
        // Use video player for MP4 files in menu
        loadVideo(currentUrl, false); // Unmuted for menu videos
      } else {
        // Use iframe for YouTube and website URLs in menu
        videoIframe.style.display = 'block';
        videoPlayer.style.display = 'none';
        const embedUrl = convertToEmbedUrl(currentUrl, false); // Unmuted for menu videos
        videoIframe.src = embedUrl;
        
        // Timer for YouTube videos in menu
        setTimeout(() => {
          loadNextMenuVideo();
        }, 220000); // 220 seconds
      }
      
      videoContainer.style.pointerEvents = 'none';
      menuVideoIndex++;
    }

    function loadNextVideo() {
      if (videos.length === 0) return;
      
      currentVideoUrl = videos[videoIndex];
      loadVideo(currentVideoUrl, true); // Keep muted for background videos
      
      videoIndex = (videoIndex + 1) % videos.length;
    }

    function convertToEmbedUrl(url, muted = true) {
      // Convert YouTube watch URLs to embed URLs
      if (url.includes('youtube.com/watch')) {
        const videoId = url.split('v=')[1]?.split('&')[0];
        if (videoId) {
          const muteParam = muted ? '&mute=1' : '';
          return `https://www.youtube.com/embed/${videoId}?autoplay=1${muteParam}&controls=0&showinfo=0&rel=0&loop=0&playlist=${videoId}`;
        }
      }
      
      return url;
    }

    function loadVideo(url, muted = true) {
      const isMP4 = url.toLowerCase().endsWith('.mp4');
      
      if (isMP4) {
        // Use HTML5 video player for MP4 files
        videoIframe.style.display = 'none';
        videoPlayer.style.display = 'block';
        videoPlayer.src = url;
        videoPlayer.muted = muted;
        videoPlayer.loop = false; // Don't loop, let it play through
        videoPlayer.autoplay = true;
        
        // Listen for video end to load next video
        videoPlayer.onended = () => {
          if (!isMenuMode) {
            loadNextVideo();
          } else {
            loadNextMenuVideo();
          }
        };
      } else {
        // Use iframe for YouTube and other URLs
        videoIframe.style.display = 'block';
        videoPlayer.style.display = 'none';
        const embedUrl = convertToEmbedUrl(url, muted);
        videoIframe.src = embedUrl;
        
        // For YouTube videos, use a longer timer to allow full playback
        // Most YouTube videos are 3-10 minutes, so we'll use 220 seconds as default
        setTimeout(() => {
          if (!isMenuMode) {
            loadNextVideo();
          } else {
            loadNextMenuVideo();
          }
        }, 220000); // 220 seconds
      }
    }

    function setImage(num) {
      const filename = `mpm${num}.png`;
      console.log('Loading image:', filename);
      const img = new Image();
      img.onload = () => {
        console.log('Image loaded successfully:', filename);
        bg.style.backgroundImage = `url('${filename}')`;
        index = num + 1;
        
        // Only toggle video visibility if not in menu mode
        if (!isMenuMode) {
          // Check if this is an odd or even background
          const isOddBackground = (num % 2 === 1);
          
          if (isOddBackground) {
            // Odd backgrounds: fade in
            isVideoVisible = true;
            showVideo();
          } else {
            // Even backgrounds: immediately hide (no fade out)
            isVideoVisible = false;
            hideVideo();
          }
        }
      };
      img.onerror = () => {
        console.log('Image failed to load:', filename);
        index = 1;
        setImage(index);
      };
      img.src = filename;
    }

    function showVideo() {
      // First load: 150% size, subsequent loads: random size
      if (isFirstVideoLoad) {
        videoScale = 1.5; // 150% size for first load
        isFirstVideoLoad = false;
      } else {
        // Random size between 0.5 and 3.0 scale
        videoScale = 0.5 + Math.random() * 2.5;
      }
      
      // Random position above central y-axis (0-50% range)
      videoY = Math.random() * 50;
      
      // Always central horizontally
      videoX = 50;
      
      // Random opacity between 0.3 and 0.8
      videoOpacity = 0.3 + Math.random() * 0.5;
      
      // Load next video if we don't have one currently playing
      if (!isMenuMode && !currentVideoUrl) {
        loadNextVideo();
      }
      
      // Fade in over 5 seconds
      videoContainer.classList.remove('fade-out');
      videoContainer.classList.add('fade-in');
      
      updateVideoPosition();
    }

    function hideVideo() {
      // Immediately hide without fade out
      videoContainer.style.opacity = '0';
      videoContainer.classList.remove('fade-in');
      videoContainer.classList.add('fade-out');
    }

    function updateVideoPosition() {
      videoContainer.style.left = `${videoX}%`;
      videoContainer.style.top = `${videoY}%`;
      videoContainer.style.transform = `translate(-50%, -50%) scale(${videoScale})`;
      videoContainer.style.opacity = videoOpacity;
      
      // Force opacity update by removing and re-adding classes
      if (videoContainer.classList.contains('fade-in')) {
        videoContainer.classList.remove('fade-in');
        videoContainer.classList.add('fade-in');
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      const step = 5;
      const opacityStep = 0.1;
      const scaleStep = 0.1;
      
      switch(e.key.toLowerCase()) {
        case 's':
          openExternalSite();
          break;
        case 'a':
          toggleExternalInteraction();
          toggleAssistant();
          break;
        case 'm':
          toggleMusicMute();
          break;
        case 'u':
          videoY = Math.max(0, videoY - step);
          break;
        case 'd':
          videoY = Math.min(100, videoY + step);
          break;
        case 'l':
          // Move left
          videoX = Math.max(0, videoX - step);
          break;
        case '0':
          // Show login screen
          showLoginScreen();
          break;
        case 'r':
          // Move right
          videoX = Math.min(100, videoX + step);
          break;
        case 'o':
          videoOpacity = Math.max(0, videoOpacity - opacityStep);
          break;
        case 'p':
          videoOpacity = Math.min(0.9, videoOpacity + opacityStep);
          break;
        case '-':
          videoScale = Math.max(0.1, videoScale - scaleStep);
          break;
        case '=':
        case '+':
          videoScale = Math.min(3, videoScale + scaleStep);
          break;
        case '?':
          showHelp();
          break;
        default:
          // F1-F9 keys for reload
          if (e.key.startsWith('F') && e.key.length === 2) {
            const fNumber = parseInt(e.key.substring(1));
            if (fNumber >= 1 && fNumber <= 9) {
              if (isMenuMode) {
                loadNextMenuVideo();
              } else {
                loadNextVideo();
              }
            }
          }
      }
      
      updateVideoPosition();
    });

    function openExternalSite() {
      externalOverlay.style.display = 'block';
      if (externalIframe.src !== 'https://mindseye.dev/') {
        externalIframe.src = 'https://mindseye.dev/';
      }
      setExternalInteraction(false);
    }

    function setExternalInteraction(enabled) {
      externalInteractionEnabled = enabled;
      externalIframe.style.pointerEvents = enabled ? 'auto' : 'none';
    }

    function toggleExternalInteraction() {
      if (externalOverlay.style.display !== 'block') return;
      setExternalInteraction(!externalInteractionEnabled);
    }

    // Close external overlay on ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (externalOverlay.style.display === 'block') {
          externalOverlay.style.display = 'none';
          // Reset interactivity state when closing
          setExternalInteraction(false);
          // Optionally clear the src to stop any playing media
          // externalIframe.src = '';
        }
      }
    });

    function toggleMusicMute() {
      audioPlayer.muted = !audioPlayer.muted;
    }

    function showAssistant() {
      if (!luckyVideo) return;
      luckyVideo.style.display = 'block';
      isAssistantVisible = true;
      // enable audio
      luckyVideo.muted = false;
      luckyVideo.volume = 1.0;
      // Attempt play in case browser paused on display change
      // Force reload source and play to handle caching/first toggle
      if (luckyVideo.readyState < 2) {
        luckyVideo.load();
      }
      luckyVideo.play().catch((err) => {
        console.warn('Assistant play blocked or failed:', err);
      });
    }

    function hideAssistant() {
      if (!luckyVideo) return;
      luckyVideo.style.display = 'none';
      luckyVideo.muted = true;
      isAssistantVisible = false;
    }

    function toggleAssistant() {
      if (isAssistantVisible) {
        hideAssistant();
      } else {
        showAssistant();
      }
    }

    // Diagnostics for assistant video
    if (luckyVideo) {
      luckyVideo.addEventListener('error', () => {
        console.error('Assistant video failed to load. Check lucky-assistant.webm path and MIME.');
      });
      luckyVideo.addEventListener('canplay', () => {
        console.log('Assistant video can play.');
      });
      luckyVideo.addEventListener('loadeddata', () => {
        console.log('Assistant video data loaded.');
      });
    }

    function showLoginScreen() {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('passwordInput').focus();
    }

    function attemptLogin() {
      const password = document.getElementById('passwordInput').value;
      const errorMessage = document.getElementById('errorMessage');
      
      if (password === atob('Y2hhcmxlcw==')) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('passwordInput').value = '';
        errorMessage.textContent = '';
        
        videoX = 50;
        videoY = 50;
        videoScale = 1;
        videoOpacity = 0.8;
        updateVideoPosition();
        
        isMenuMode = true;
        isLoggedIn = true;
        loadMenuPlaylist();
        
        videoContainer.classList.remove('fade-out');
        videoContainer.classList.add('fade-in');
        
      } else {
        errorMessage.textContent = 'ACCESS DENIED';
      }
    }

    function showHelp() {
      alert('CONTROLS:\n\nU/D: Move Up/Down\nL/R: Move Left/Right\nO/P: Decrease/Increase Opacity\n-/+: Decrease/Increase Size\nF1-F9: Reload Documents\nS: Open Site Overlay\nA: Toggle Assistant / Interactivity\nM: Mute/Unmute Music\nESC: Close Site Overlay\n?: Help\n0: Login\n\n.version1.1.mod');
    }

    function typewriterEffect(element, text, speed = 50) {
      let i = 0;
      let currentLine = '';
      const lines = text.split('<br>');
      let lineIndex = 0;
      element.innerHTML = '';
      
      function type() {
        if (lineIndex < lines.length) {
          if (i < lines[lineIndex].length) {
            currentLine += lines[lineIndex].charAt(i);
            element.innerHTML = lines.slice(0, lineIndex).join('<br>') + '<br>' + currentLine;
            i++;
            setTimeout(type, speed);
          } else {
            // Move to next line
            lineIndex++;
            i = 0;
            currentLine = '';
            setTimeout(type, speed * 2); // Slight pause between lines
          }
        } else {
          // Add blinking cursor after all text is complete
          element.innerHTML += '<span class="typewriter"></span>';
        }
      }
      
      type();
    }

    function closeLogin() {
      location.reload();
    }

    // Add event listener for input box
    document.addEventListener('DOMContentLoaded', function() {
      const controlsInput = document.getElementById('controlsInput');
      
      controlsInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          // Clear the input
          controlsInput.value = '';
          
          // Clear and restart typewriter effect
          const controlsText = document.getElementById('controlsText');
          controlsText.innerHTML = '';
          
          // Restart typewriter effect
          const controlsContent = `U/D: Move Up/Down<br>L/R: Move Left/Right<br>O/P: Decrease/Increase Opacity<br>-/+: Decrease/Increase Size<br>F1-F9: Reload Documents<br>S: Open Site Overlay<br>A: Toggle Assistant / Interactivity<br>M: Mute/Unmute Music<br>ESC: Close Site Overlay<br>?: Help<br>0: Login<br>.version1.1.mod<br>You are now logging-in to:<br><span style="color: #ff0066; text-shadow: 0 0 10px #ff0066;">Maya Records</span><br>Control://<span style="background: transparent; border: 1px solid rgba(0, 255, 0, 0.5); color: #00ff00; padding: 1px 3px; border-radius: 2px;">input</span><remote><br><array><logged><br>${new Date().toLocaleString('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })}`;
          typewriterEffect(controlsText, controlsContent, 30);
        }
      });
    });

    document.body.addEventListener('click', () => {
      console.log('Click detected, loading image:', index);
      setImage(index);
    });

    // Initialize
    console.log('Initializing with mpm1.png');
    loadVideoPlaylist();
    setImage(index);
    
    // Show video container after 6 seconds
    setTimeout(() => {
      videoContainer.style.opacity = '0.5';
    }, 6000);
    
    // Fade in everything after 5 seconds
    setTimeout(() => {
      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.style.opacity = '0';
      setTimeout(() => {
        loadingOverlay.style.display = 'none';
        
        // Start typewriter effect for controls
        const controlsText = document.getElementById('controlsText');
        const controlsContent = `U/D: Move Up/Down<br>L/R: Move Left/Right<br>O/P: Decrease/Increase Opacity<br>-/+: Decrease/Increase Size<br>F1-F9: Reload Documents<br>S: Open Site Overlay<br>A: Toggle Assistant / Interactivity<br>M: Mute/Unmute Music<br>ESC: Close Site Overlay<br>?: Help<br>0: Login<br>.version1.1.mod<br>You are now logging-in to:<br><span style="color: #ff0066; text-shadow: 0 0 10px #ff0066;">Maya Records</span><br>Control://<span style="background: transparent; border: 1px solid rgba(0, 255, 0, 0.5); color: #00ff00; padding: 1px 3px; border-radius: 2px;">input</span><remote><br><array><logged><br>${new Date().toLocaleString('en-US', { timeZone: 'America/Los_Angeles', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false })}`;
        typewriterEffect(controlsText, controlsContent, 30);
      }, 1000);
    }, 5000);

    // Ensure audio plays when user interacts (browser autoplay policy)
    document.addEventListener('click', function() {
      if (audioPlayer.paused) {
        audioPlayer.play().catch(e => console.log('Audio play failed:', e));
      }
    }, { once: true });
  </script>
</body>
</html>
