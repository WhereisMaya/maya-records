<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>🕹️ Maya Records 🎭</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: black;
    }

    #background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.4s ease-in-out;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="background"></div>
  
  <audio id="audio-player" autoplay loop>
    <source src="Track1NGE.mp3" type="audio/mpeg">
  </audio>

  <script>
    let index = 1;
    const bg = document.getElementById('background');
    const audioPlayer = document.getElementById('audio-player');

    function setImage(num) {
      const filename = `mpm${num}.png`;
      console.log('Loading image:', filename);
      const img = new Image();
      img.onload = () => {
        console.log('Image loaded successfully:', filename);
        bg.style.backgroundImage = `url('${filename}')`;
        index = num + 1;
      };
      img.onerror = () => {
        console.log('Image failed to load:', filename);
        index = 1;
        setImage(index);
      };
      img.src = filename;
    }

    document.body.addEventListener('click', () => {
      console.log('Click detected, loading image:', index);
      setImage(index);
    });

    // Initialize with mpm1.png
    console.log('Initializing with mpm1.png');
    setImage(index);

    // Ensure audio plays when user interacts (browser autoplay policy)
    document.addEventListener('click', function() {
      if (audioPlayer.paused) {
        audioPlayer.play().catch(e => console.log('Audio play failed:', e));
      }
    }, { once: true });
  </script>
</body>
</html>
