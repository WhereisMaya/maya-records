<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>🕹️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: black;
    }

    #background {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-color: black;
      transition: background-image 0.5s ease-in-out;
      z-index: 1;
    }

    #video-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      height: 90vh;
      z-index: 2;
      opacity: 0.5;
      transition: opacity 5s ease-in-out;
      pointer-events: none;
    }

    #video-iframe {
      width: 100%;
      height: 100%;
      border: none;
      transform-origin: center;
      transition: transform 0.3s ease;
    }

    .fade-in {
      opacity: 0.5;
    }

    .fade-out {
      opacity: 0;
    }

    .controls-info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: white;
      font-family: monospace;
      font-size: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.9);
      padding: 8px;
      border-radius: 5px;
    }

    .login-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #000, #1a1a1a, #000);
      z-index: 1000;
      display: none;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
    }

    .login-container {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #00ff00;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      color: #00ff00;
      box-shadow: 0 0 20px #00ff00;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 0 20px #00ff00; }
      to { box-shadow: 0 0 30px #00ff00, 0 0 40px #00ff00; }
    }

    .login-container h2 {
      margin-bottom: 20px;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .login-container input {
      background: transparent;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px;
      margin: 10px 0;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      outline: none;
      width: 200px;
    }

    .login-container input:focus {
      box-shadow: 0 0 10px #00ff00;
    }

    .login-container button {
      background: transparent;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      transition: all 0.3s;
    }

    .login-container button:hover {
      background: #00ff00;
      color: #000;
    }

    .error-message {
      color: #ff0000;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="background"></div>
  
  <div id="video-container">
    <iframe id="video-iframe" 
            src="" 
            frameborder="0" 
            allowfullscreen
            allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <audio id="audio-player" autoplay loop>
    <source src="Track1NGE.mp3" type="audio/mpeg">
  </audio>

  <div class="controls-info">
    <div>U/D: Move Up/Down</div>
    <div>L/R: Move Left/Right</div>
    <div>O/P: Decrease/Increase Opacity</div>
    <div>-/+: Decrease/Increase Size</div>
    <div>F1-F9: Reload Video</div>
    <div>?: Help</div>
    <div>0: Login</div>
    <div>.version1.1.mod</div>
  </div>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-container">
      <h2>SYSTEM LOGIN</h2>
      <input type="password" id="passwordInput" placeholder="Enter password..." />
      <br>
      <button onclick="attemptLogin()">ACCESS</button>
      <div class="error-message" id="errorMessage"></div>
    </div>
  </div>

  <script>
    let index = 1;
    let videoIndex = 0;
    let isVideoVisible = false;
    let videos = [];
    let currentVideoUrl = '';
    let isLoggedIn = false;
    let menuVideos = [];
    let menuVideoIndex = 0;
    let isMenuMode = false;
    
    const bg = document.getElementById('background');
    const audioPlayer = document.getElementById('audio-player');
    const videoContainer = document.getElementById('video-container');
    const videoIframe = document.getElementById('video-iframe');

    // Video player state
    let videoX = 50; // percentage
    let videoY = 50; // percentage
    let videoOpacity = 0.5;
    let videoScale = 1;

    // Load video playlist
    async function loadVideoPlaylist() {
      try {
        const response = await fetch('videopl.txt');
        const text = await response.text();
        videos = text.trim().split('\n').filter(line => line.trim() !== '');
        if (videos.length > 0) {
          loadNextVideo();
        }
      } catch (error) {
        console.error('Failed to load video playlist:', error);
      }
    }

    // Load menu video playlist
    async function loadMenuPlaylist() {
      try {
        const response = await fetch('menupl.txt');
        const text = await response.text();
        menuVideos = text.trim().split('\n').filter(line => line.trim() !== '');
        if (menuVideos.length > 0) {
          loadNextMenuVideo();
        }
      } catch (error) {
        console.error('Failed to load menu playlist:', error);
      }
    }

    function loadNextMenuVideo() {
      if (menuVideos.length === 0) return;
      
      if (menuVideoIndex >= menuVideos.length) {
        // All videos played, show the last URL as a website
        const lastUrl = menuVideos[menuVideos.length - 1];
        if (lastUrl.includes('http')) {
          videoIframe.src = lastUrl;
          videoContainer.style.pointerEvents = 'auto';
        }
        return;
      }
      
      const currentUrl = menuVideos[menuVideoIndex];
      const embedUrl = convertToEmbedUrl(currentUrl, false); // Unmuted for menu videos
      videoIframe.src = embedUrl;
      videoContainer.style.pointerEvents = 'none';
      
      menuVideoIndex++;
    }

    function loadNextVideo() {
      if (videos.length === 0) return;
      
      currentVideoUrl = videos[videoIndex];
      const embedUrl = convertToEmbedUrl(currentVideoUrl, true); // Keep muted for background videos
      videoIframe.src = embedUrl;
      
      videoIndex = (videoIndex + 1) % videos.length;
    }

    function convertToEmbedUrl(url, muted = true) {
      // Convert YouTube watch URLs to embed URLs
      if (url.includes('youtube.com/watch')) {
        const videoId = url.split('v=')[1]?.split('&')[0];
        if (videoId) {
          const muteParam = muted ? '&mute=1' : '';
          return `https://www.youtube.com/embed/${videoId}?autoplay=1${muteParam}&controls=0&showinfo=0&rel=0&loop=1&playlist=${videoId}`;
        }
      }
      return url;
    }

    function setImage(num) {
      const filename = `mpm${num}.png`;
      console.log('Loading image:', filename);
      const img = new Image();
      img.onload = () => {
        console.log('Image loaded successfully:', filename);
        bg.style.backgroundImage = `url('${filename}')`;
        index = num + 1;
        
        // Only toggle video visibility if not in menu mode
        if (!isMenuMode) {
          // Check if this is an odd or even background
          const isOddBackground = (num % 2 === 1);
          
          if (isOddBackground) {
            // Odd backgrounds: fade in
            isVideoVisible = true;
            showVideo();
          } else {
            // Even backgrounds: immediately hide (no fade out)
            isVideoVisible = false;
            hideVideo();
          }
        }
      };
      img.onerror = () => {
        console.log('Image failed to load:', filename);
        index = 1;
        setImage(index);
      };
      img.src = filename;
    }

    function showVideo() {
      // Random size between 0.5 and 3.0 scale
      videoScale = 0.5 + Math.random() * 2.5;
      
      // Random position above central y-axis (0-50% range)
      videoY = Math.random() * 50;
      
      // Always central horizontally
      videoX = 50;
      
      // Random opacity between 0.3 and 0.8
      videoOpacity = 0.3 + Math.random() * 0.5;
      
      // Load next video in playlist
      if (!isMenuMode) {
        loadNextVideo();
      }
      
      // Fade in over 5 seconds
      videoContainer.classList.remove('fade-out');
      videoContainer.classList.add('fade-in');
      
      updateVideoPosition();
    }

    function hideVideo() {
      // Immediately hide without fade out
      videoContainer.style.opacity = '0';
      videoContainer.classList.remove('fade-in');
      videoContainer.classList.add('fade-out');
    }

    function updateVideoPosition() {
      videoContainer.style.left = `${videoX}%`;
      videoContainer.style.top = `${videoY}%`;
      videoContainer.style.transform = `translate(-50%, -50%) scale(${videoScale})`;
      videoContainer.style.opacity = videoOpacity;
      
      // Force opacity update by removing and re-adding classes
      if (videoContainer.classList.contains('fade-in')) {
        videoContainer.classList.remove('fade-in');
        videoContainer.classList.add('fade-in');
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      const step = 5;
      const opacityStep = 0.1;
      const scaleStep = 0.1;
      
      switch(e.key.toLowerCase()) {
        case 'u':
          videoY = Math.max(0, videoY - step);
          break;
        case 'd':
          videoY = Math.min(100, videoY + step);
          break;
        case 'l':
          // Move left
          videoX = Math.max(0, videoX - step);
          break;
        case '0':
          // Show login screen
          showLoginScreen();
          break;
        case 'r':
          // Move right
          videoX = Math.min(100, videoX + step);
          break;
        case 'o':
          videoOpacity = Math.max(0, videoOpacity - opacityStep);
          break;
        case 'p':
          videoOpacity = Math.min(0.9, videoOpacity + opacityStep);
          break;
        case '-':
          videoScale = Math.max(0.1, videoScale - scaleStep);
          break;
        case '=':
        case '+':
          videoScale = Math.min(3, videoScale + scaleStep);
          break;
        case '?':
          showHelp();
          break;
        default:
          // F1-F9 keys for reload
          if (e.key.startsWith('F') && e.key.length === 2) {
            const fNumber = parseInt(e.key.substring(1));
            if (fNumber >= 1 && fNumber <= 9) {
              if (isMenuMode) {
                loadNextMenuVideo();
              } else {
                loadNextVideo();
              }
            }
          }
      }
      
      updateVideoPosition();
    });

    function showLoginScreen() {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('passwordInput').focus();
    }

    function attemptLogin() {
      const password = document.getElementById('passwordInput').value;
      const errorMessage = document.getElementById('errorMessage');
      
      if (password === 'charles') {
        // Login successful
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('passwordInput').value = '';
        errorMessage.textContent = '';
        
        // Position iframe correctly
        videoX = 50;
        videoY = 50;
        videoScale = 1;
        videoOpacity = 0.8;
        updateVideoPosition();
        
        // Switch to menu mode
        isMenuMode = true;
        isLoggedIn = true;
        loadMenuPlaylist();
        
        // Show video immediately
        videoContainer.classList.remove('fade-out');
        videoContainer.classList.add('fade-in');
        
      } else {
        errorMessage.textContent = 'ACCESS DENIED';
      }
    }

    function showHelp() {
      alert('CONTROLS:\n\nU/D: Move Up/Down\nL/R: Move Left/Right\nO/P: Decrease/Increase Opacity\n-/+: Decrease/Increase Size\nF1-F9: Reload Video\n?: Help\n0: Login\n\n.version1.1.mod');
    }

    document.body.addEventListener('click', () => {
      console.log('Click detected, loading image:', index);
      setImage(index);
    });

    // Initialize
    console.log('Initializing with mpm1.png');
    loadVideoPlaylist();
    setImage(index);

    // Ensure audio plays when user interacts (browser autoplay policy)
    document.addEventListener('click', function() {
      if (audioPlayer.paused) {
        audioPlayer.play().catch(e => console.log('Audio play failed:', e));
      }
    }, { once: true });
  </script>
</body>
</html>
